<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>个人博客</title>
    <meta name="description" content="一个支持 Markdown 与 KaTeX 的在线写作博客。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✦%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />
    <!-- 仅使用系统字体，避免第三方字体请求拖慢首次渲染。 -->
    <script>
      // 防止深色模式闪烁：在样式加载前决定主题
      (function () {
        try {
          var stored = localStorage.getItem('starlog:theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')

          var font = localStorage.getItem('starlog:font')
          if (font && ['system', 'modern', 'serif', 'rounded'].indexOf(font) !== -1) {
            document.documentElement.dataset.font = font
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
