<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>个人博客</title>
    <meta name="description" content="一个支持 Markdown 与 KaTeX 的在线写作博客。" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-venti.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />
    <!-- 默认使用系统字体；管理员选择的本机字体会在 React 启动前先恢复。 -->
    <script>
      // 防止主题与字体在首屏闪烁。
      ;(function () {
        try {
          var stored = localStorage.getItem('starlog:theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')

          var savedFont = JSON.parse(localStorage.getItem('starlog:font') || 'null')
          // 新版多字体栈（families），兼容旧版单字体（family）
          var fonts = savedFont
            ? Array.isArray(savedFont.families)
              ? savedFont.families
              : typeof savedFont.family === 'string' && savedFont.family.trim()
                ? [savedFont.family]
                : []
            : []
          fonts = fonts
            .map(function (f) {
              return String(f || '').trim()
            })
            .filter(function (f) {
              return f && f.length <= 120 && !/[{};<>\n\r]/.test(f)
            })
            .slice(0, 6)
          if (fonts.length > 0) {
            var stack = fonts
              .map(function (f) {
                return '"' + f.replace(/["\\]/g, '\\$&') + '"'
              })
              .join(', ')
            document.documentElement.style.setProperty(
              '--font-sans',
              stack + ', system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
            )
            document.documentElement.style.setProperty(
              '--font-serif',
              stack + ', "Noto Serif SC", "Songti SC", STSong, SimSun, serif',
            )
          }

          var savedBackground = JSON.parse(localStorage.getItem('starlog:background') || 'null')
          var color = savedBackground && typeof savedBackground.color === 'string' ? savedBackground.color.trim() : ''
          if (/^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color)) {
            var hex = color.slice(1)
            if (hex.length === 3 || hex.length === 4) {
              hex = hex
                .split('')
                .map(function (part) {
                  return part + part
                })
                .join('')
            }
            var red = parseInt(hex.slice(0, 2), 16)
            var green = parseInt(hex.slice(2, 4), 16)
            var blue = parseInt(hex.slice(4, 6), 16)
            var alpha = hex.length === 8 ? parseInt(hex.slice(6, 8), 16) / 255 : 1
            var storedIntensity = savedBackground && Number(savedBackground.intensity)
            var intensity = isFinite(storedIntensity) ? Math.max(0, Math.min(100, storedIntensity)) / 100 : 0.5
            var secondaryRed = Math.round(red * 0.7 + 129 * 0.3)
            var secondaryGreen = Math.round(green * 0.7 + 140 * 0.3)
            var secondaryBlue = Math.round(blue * 0.7 + 248 * 0.3)

            document.documentElement.style.setProperty(
              '--site-background-tint-primary',
              'rgba(' + red + ', ' + green + ', ' + blue + ', ' + (alpha * 0.42 * intensity).toFixed(3) + ')',
            )
            document.documentElement.style.setProperty(
              '--site-background-tint-secondary',
              'rgba(' + secondaryRed + ', ' + secondaryGreen + ', ' + secondaryBlue + ', ' + (alpha * 0.3 * intensity).toFixed(3) + ')',
            )
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
