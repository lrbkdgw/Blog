<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>星野笔记 · Starlog</title>
    <meta name="description" content="一个支持 Markdown 与 KaTeX 的在线写作博客。" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-venti.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />
    <!-- 字体直接使用系统字体栈（见 tailwind.config.js）：
         不再请求 Google Fonts，避免在部分网络环境下页面被阻塞数分钟 -->
    <script>
      // 防止深色模式闪烁：在样式加载前决定主题
      (function () {
        try {
          var stored = localStorage.getItem('starlog:theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
