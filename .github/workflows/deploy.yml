name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    # 只有这些路径变化时才重新部署
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的提交会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # 项目主页需要把 base 设为 /<仓库名>/；
        # 如果仓库名是 <用户名>.github.io，则自动使用 /
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      # 说明：不再使用 actions/configure-pages（历史上曾在这里失败导致部署中断），
      # upload-pages-artifact + deploy-pages 本身不依赖它。
      # ⚠️ 仓库的 Pages 需要在 Settings → Pages 中选择 “GitHub Actions” 作为部署来源。

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 曾被配置为「从分支部署（legacy）」，导致线上是未构建的源码、页面空白。
      # 这里自动把部署来源切换为 GitHub Actions；若权限不足会给出提示而不中断。
      - name: 确保 Pages 部署来源为 GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          echo "当前 Pages build_type: $current"
          if [[ "$current" != "workflow" ]]; then
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
              echo "已切换为 workflow 部署模式"
            else
              echo "::warning::无法自动切换 Pages 部署模式，请到 Settings → Pages → Build and deployment → Source 手动选择 GitHub Actions"
            fi
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
