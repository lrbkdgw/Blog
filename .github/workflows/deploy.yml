name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    # 只有这些路径变化时才重新部署
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的提交会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # 项目主页需要把 base 设为 /<仓库名>/；
        # 如果仓库名是 <用户名>.github.io，则自动使用 /
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      # 说明：不再使用 actions/configure-pages（历史上曾在这里失败导致部署中断），
      # upload-pages-artifact + deploy-pages 本身不依赖它。
      # ⚠️ 仓库的 Pages 需要在 Settings → Pages 中选择 “GitHub Actions” 作为部署来源。

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 如果 Pages 仍是 legacy「从分支部署」，push 会同时启动一次 Jekyll 构建。
      # 它可能在 deploy-pages 之后完成并把已构建的网站覆盖成仓库源码，最终导致白屏。
      # GITHUB_TOKEN 无权修改 Pages 的 build_type，因此先等 legacy 构建结束，确保
      # deploy-pages 始终是最后一次发布。仍建议在 Settings → Pages 中改成 GitHub Actions。
      - name: 检查 Pages 部署来源并等待旧构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          echo "当前 Pages build_type: $build_type"
          if [[ "$build_type" == "legacy" ]]; then
            echo "::warning::Pages 仍使用从分支部署；请在 Settings → Pages → Build and deployment → Source 选择 GitHub Actions"
            for attempt in {1..30}; do
              result=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                --jq '[.commit, .status] | @tsv' 2>/dev/null || true)
              commit=${result%%$'\t'*}
              status=${result#*$'\t'}
              echo "legacy build ($attempt/30): commit=$commit status=$status"
              if [[ "$commit" == "$GITHUB_SHA" && ( "$status" == "built" || "$status" == "errored" ) ]]; then
                break
              fi
              sleep 5
            done
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
