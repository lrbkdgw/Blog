name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    # 只有这些路径变化时才重新部署
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的提交会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        # 项目主页需要把 base 设为 /<仓库名>/；
        # 如果仓库名是 <用户名>.github.io，则自动使用 /
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build

      # 说明：不再使用 actions/configure-pages（历史上曾在这里失败导致部署中断），
      # upload-pages-artifact + deploy-pages 本身不依赖它。
      # ⚠️ 仓库的 Pages 需要在 Settings → Pages 中选择 “GitHub Actions” 作为部署来源。

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
