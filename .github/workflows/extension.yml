name: 验证 Markdown 语法拓展

on:
  push:
    branches: [main]
    paths:
      - 'vscode_extensions/**'
      - 'src/components/Markdown.tsx'
      - 'src/components/ShowBox.tsx'
      - 'src/components/CoordinateSystem.tsx'
      - 'src/lib/showBox.ts'
      - 'src/lib/coordinateSystem.ts'
      - 'src/lib/markdownSource.ts'
      - 'src/lib/frontmatter.ts'
      - 'src/styles/**'
      - 'tailwind.config.js'
      - 'package*.json'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'vscode_extensions/**'
      - 'src/components/Markdown.tsx'
      - 'src/components/ShowBox.tsx'
      - 'src/components/CoordinateSystem.tsx'
      - 'src/lib/showBox.ts'
      - 'src/lib/coordinateSystem.ts'
      - 'src/lib/markdownSource.ts'
      - 'src/lib/frontmatter.ts'
      - 'src/styles/**'
      - 'tailwind.config.js'
      - 'package*.json'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode_extensions/v1/package-lock.json
      - name: 安装博客与扩展依赖
        run: |
          npm ci
          npm ci --prefix vscode_extensions/v1
      - name: 博客构建与扩展类型检查
        run: |
          npm run build
          npm --prefix vscode_extensions/v1 run typecheck
      - name: 安装用于渲染对照的 Chromium
        working-directory: vscode_extensions/v1
        run: |
          npx --no-install playwright-core install --with-deps chromium
          browser_path=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")
          echo "BROWSER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: DOM、CSS、交互、离线主进程与真实浏览器回归
        run: npm run extension:test
      - name: 打包可直接安装的插件
        run: npm run extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-syntax-extension
          path: vscode_extensions/v1/*.vsix
          if-no-files-found: error
