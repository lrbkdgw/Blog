name: 构建离线单文件版并发布 Release

# 每次更新 main 分支（合并 PR、网页端「统一更新」或本地 push）时自动执行：
#   1. 构建并校验最新离线单文件 HTML（dist-offline/index.html）；
#   2. 若仓库内 offline/index.html 尚未同步，自动提交回 main（附带 [skip ci] 防止死循环）；
#   3. 无论本次 PR 是否已提前构建过 offline/index.html，始终将 Git 标签 `offline` 指向最新提交，
#      并刷新 GitHub Latest Release（固定下载链接 starlog-offline-latest.html 保持不变）。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

# 提交回仓库与更新 Release 的动作必须串行，避免并发推送互相覆盖。
concurrency:
  group: offline-single-file
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建离线单文件版
        run: npx vite build --config vite.offline.config.ts

      - name: 自检产物（缺字体 / 缺文章 / 残留外链 / 内联脚本语法被破坏 → 直接失败）
        run: node scripts/verify-offline.mjs

      - name: 体积摘要（写进任务日志，方便回看每次构建的变化）
        run: |
          size=$(wc -c < dist-offline/index.html)
          echo "### 离线单文件体积：${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步 offline/index.html 到 main 分支
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist-offline/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${BRANCH}"
          mkdir -p offline
          cp dist-offline/index.html offline/index.html
          git add offline/index.html
          if git diff --cached --quiet; then
            echo "仓库中的 offline/index.html 已是最新版本，无需重复提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # [skip ci] 防止「Actions 提交 → 再次触发 push 工作流」死循环
            git commit -m "chore(offline): 更新离线单文件版 [skip ci]" --no-verify
            git push origin "HEAD:${BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: "发布最新 GitHub Release（tag: offline）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.commit.outputs.target_sha }}
          SHORT_SHA: ${{ steps.commit.outputs.short_sha }}
        run: |
          set -euo pipefail
          cp dist-offline/index.html starlog-offline-latest.html
          DATE_STR=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')
          SIZE_BYTES=$(wc -c < starlog-offline-latest.html | tr -d ' ')
          SHA256_SUM=$(sha256sum starlog-offline-latest.html | awk '{print $1}')

          {
            cat .github/offline-release-notes.md
            echo ""
            echo "---"
            echo ""
            echo "- **同步提交**：\`${SHORT_SHA}\`（${DATE_STR} CST）"
            echo "- **文件大小**：\`${SIZE_BYTES}\` bytes"
            echo "- **SHA-256**：\`${SHA256_SUM}\`"
          } > release-notes.generated.md

          # 将滚动标签 `offline` 更新到最新提交，并重建为正式 Latest Release：
          # 1) 固定下载链接 `.../releases/download/offline/starlog-offline-latest.html` 永久有效；
          # 2) 仓库右侧 Releases 栏始终显示最新提交、最新时间与 Latest 标识；
          # 3) 只更新 tag（不触发 branches: [main] 的 push 工作流），不会产生循环。
          if gh release view offline >/dev/null 2>&1; then
            gh release delete offline -y
          fi
          git tag -fa offline "${TARGET_SHA}" -m "离线单文件版 (${SHORT_SHA})"
          git push origin refs/tags/offline --force

          gh release create offline starlog-offline-latest.html \
            --title "离线单文件版（${DATE_STR} · ${SHORT_SHA}）" \
            --notes-file release-notes.generated.md \
            --target "${TARGET_SHA}" \
            --latest

      # Actions 的 artifact 只保留 30 天，Release 才是长期入口；这里作为备用下载
      - name: 上传本次运行的 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starlog-offline-single-file
          path: dist-offline/index.html
          if-no-files-found: error
          retention-days: 30
