name: 构建离线单文件版

# 每次 main 更新都重新构建并刷新固定 tag（offline）下的 Rolling Release。
# 只发布 Release 资产，不向 main 提交、不推送或移动任何 Git ref，兼容分支保护 / ruleset。
# 发布输入只有当前 main 源码与本次构建的 dist-offline/index.html。
#
# 为什么不用第三方 vite-plugin-singlefile：它不认识 public/ 里的图标、不会转义内联代码里的
# `</script`、也不会校验 KaTeX 字体是否真的进了文件；这三件事在离线版里都属于「静默坏掉」，
# 所以我们用自研插件（scripts/vite-plugin-single-html.mjs）+ 构建后自检（scripts/verify-offline.mjs）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# contents:write 仅用于创建 / 编辑 Release 与上传资产，不需要 main 的分支推送权限。
permissions:
  contents: write

# 覆盖同名 Release 资产必须串行，避免较旧的运行后完成并覆盖新版本。
concurrency:
  group: offline-single-file
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch 也只能从 main 发布，避免手动在功能分支上覆盖最新版。
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建离线单文件版
        run: npx vite build --config vite.offline.config.ts

      - name: 自检产物（缺字体 / 缺文章 / 残留外链 / 内联脚本语法被破坏 → 直接失败）
        run: node scripts/verify-offline.mjs

      - name: 体积与校验和摘要
        id: artifact
        run: |
          size=$(wc -c < dist-offline/index.html)
          digest=$(sha256sum dist-offline/index.html | cut -d' ' -f1)
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### 离线单文件产物"
            echo "- 体积：${size} bytes"
            echo "- SHA-256：\`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 不 push main，也不移动 offline tag：固定 tag 只是稳定下载入口。
      # 本次 main 的完整 SHA 写入标题与说明，资产内容始终以这次构建为准。
      - name: "刷新 Rolling Release（固定 tag: offline）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          TARGET="$GITHUB_SHA"
          SHA="${GITHUB_SHA::7}"
          cp dist-offline/index.html starlog-offline-latest.html
          {
            echo "本次构建：[\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${TARGET}) · [Actions 日志](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "文件 SHA-256：\`${DIGEST}\`"
            echo
            cat .github/offline-release-notes.md
          } > /tmp/starlog-offline-release-notes.md

          if gh release view offline >/dev/null 2>&1; then
            gh release edit offline \
              --title "离线单文件版（${SHA}）" \
              --notes-file /tmp/starlog-offline-release-notes.md \
              --prerelease \
              --latest=false
            gh release upload offline starlog-offline-latest.html --clobber
          else
            # 仅首次创建固定 tag / Release 时指定目标；后续更新绝不移动 tag。
            gh release create offline starlog-offline-latest.html \
              --title "离线单文件版（${SHA}）" \
              --notes-file /tmp/starlog-offline-release-notes.md \
              --target "${TARGET}" \
              --prerelease \
              --latest=false
          fi
          gh release view offline --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

      # Actions 的 artifact 只保留 30 天，Release 才是长期入口；这里作为备用下载。
      - name: 上传本次运行的 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starlog-offline-single-file
          path: dist-offline/index.html
          if-no-files-found: error
          retention-days: 30
