name: 构建离线单文件版

# 产出：一个可直接双击打开的 HTML（离线版博客）。
#   1. 提交回仓库的 offline/index.html（仓库内的稳定副本）；
#   2. 覆盖发布 Releases 上的滚动 tag `offline`（starlog-offline-latest.html）。
#
# 「每次 main 更新都自动更新」的关键：
#   - 只要命中下面的构建输入（含 tailwind / postcss / public 图标），就重新构建并自检；
#   - 即使 offline/index.html 内容没有变化（例如上次构建已提交过、本次只改动了
#     不影响产物的注释），Release 的标题 / 说明 / 附件仍然刷新一次，并记录来源提交；
#   - Release 使用固定 tag 与固定资产名，下载地址永远不变，历史版本看 git 提交记录，
#     不会在 Release 里堆出上百个附件。
#
# 为什么不用第三方 vite-plugin-singlefile：它不认识 public/ 里的图标、不会转义内联代码里的
# `</script`、也不会校验 KaTeX 字体是否真的进了文件；这三件事在离线版里都属于「静默坏掉」，
# 所以我们用自研插件（scripts/vite-plugin-single-html.mjs）+ 构建后自检（scripts/verify-offline.mjs）。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.offline.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'scripts/vite-plugin-single-html.mjs'
      - 'scripts/verify-offline.mjs'
      - '.github/offline-release-notes.md'
      - '.github/workflows/offline.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# 提交回仓库与覆盖 Release 都必须串行，否则会互相覆盖；这里不取消进行中的任务。
concurrency:
  group: offline-single-file
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建离线单文件版
        run: npx vite build --config vite.offline.config.ts

      - name: 自检产物（缺字体 / 缺文章 / 残留外链 / 内联脚本语法被破坏 → 直接失败）
        run: node scripts/verify-offline.mjs

      - name: 体积摘要（写进任务日志，方便回看每次构建的变化）
        run: |
          size=$(wc -c < dist-offline/index.html)
          echo "### 离线单文件体积：${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: 把产物提交回 offline/index.html
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist-offline/index.html
          mkdir -p offline
          cp dist-offline/index.html offline/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/index.html
          if git diff --cached --quiet; then
            echo "离线文件与仓库中已有版本一致，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意：[skip ci] 只是给人工 review 的提示。用 GITHUB_TOKEN 推的提交本来就不会
          # 再次触发 workflow（GitHub 的防递归规则），所以不会出现「Actions 提交 → 触发部署
          # → 触发离线构建 → 再提交」的循环；站点侧的副本由 deploy.yml 自己构建，见该文件。
          git commit -m "chore(offline): 更新离线单文件版 [skip ci]" --no-verify
          git push origin "HEAD:${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 发布 / 刷新 Rolling Release。无论 offline/index.html 是否变化都执行：
      # 只要 main 发生构建，Release 的「来源提交 / 构建时间 / 大小」就应该是新的。
      # ------------------------------------------------------------------ #
      - name: 准备 Release 说明
        id: notes
        run: |
          set -euo pipefail
          size_bytes=$(wc -c < dist-offline/index.html)
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1024 / 1024 }')
          short_sha=${GITHUB_SHA::7}
          build_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          subject=$(git log -1 --pretty=%s | tr '|' '/' | cut -c1-120)
          {
            cat .github/offline-release-notes.md
            echo
            echo '---'
            echo
            echo '## 🔖 本次构建'
            echo
            echo '| 项目 | 值 |'
            echo '| --- | --- |'
            echo "| 来源提交 | [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| 提交说明 | ${subject} |"
            echo "| 构建时间 | ${build_time} |"
            echo "| 文件大小 | ${size_mb} MB（${size_bytes} bytes） |"
            echo "| 固定下载地址 | [starlog-offline-latest.html](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/offline/starlog-offline-latest.html) |"
            echo
            echo '> 这是一个**滚动发布**：`main` 每次影响离线版的改动都会覆盖本 Release 的标题、说明与附件，'
            echo '> 下载地址保持不变。需要历史版本时，查看仓库 `offline/index.html` 的提交记录。'
          } > "$RUNNER_TEMP/offline-release-notes.md"
          echo "title=离线单文件版（rolling）· $(date -u +'%Y-%m-%d')（${short_sha}）" >> "$GITHUB_OUTPUT"

      - name: "覆盖发布 Rolling Release（tag: offline）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          cp dist-offline/index.html starlog-offline-latest.html
          if gh release view offline >/dev/null 2>&1; then
            # 只保留一个固定资产名；--clobber 原地替换，避免资产无限堆积。
            gh release upload offline starlog-offline-latest.html --clobber
            # 保持仓库原有的「滚动预发布」语义：不上抢 Latest 徽标，
            # 但标题、说明、附件与 tag 指向每次都刷新。
            gh release edit offline \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/offline-release-notes.md" \
              --prerelease --latest=false
            # 让 rolling tag 指向本次构建的来源提交，Release 页面上的 commit 才不会永远停在第一次。
            if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/offline" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null; then
              echo "::warning::无法移动 rolling tag offline（可能启用了不可变 Release）；链接与附件仍已更新"
            fi
          else
            gh release create offline starlog-offline-latest.html \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/offline-release-notes.md" \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          fi
          {
            echo "### 离线版已发布"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/offline"
            echo "- 资产: starlog-offline-latest.html"
          } >> "$GITHUB_STEP_SUMMARY"

      # Actions 的 artifact 只保留 30 天，Release 才是长期入口；这里作为备用下载
      - name: 上传本次运行的 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starlog-offline-single-file
          path: dist-offline/index.html
          if-no-files-found: error
          retention-days: 30
