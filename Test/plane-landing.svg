<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
<title>飞机降落 SVG 动画 - 纯 SVG SMIL 版</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e1a36"/><stop offset="38%" stop-color="#1e2f5a"/><stop offset="62%" stop-color="#3a4a7a"/><stop offset="78%" stop-color="#d07a4a"/><stop offset="88%" stop-color="#ff9d66"/><stop offset="100%" stop-color="#ffcf8a"/>
  </linearGradient>
  <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff7d1"/><stop offset="35%" stop-color="#ffcf8a"/><stop offset="70%" stop-color="#ff7e42" stop-opacity="0.6"/><stop offset="100%" stop-color="#ff5a2b" stop-opacity="0"/></radialGradient>
  <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2b2e38"/><stop offset="100%" stop-color="#1a1d24"/></linearGradient>
  <linearGradient id="fuselageGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="50%" stop-color="#d8e0f5"/><stop offset="100%" stop-color="#b9c6e8"/></linearGradient>
  <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="55%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
  <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient>
  <filter id="softShadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
  <radialGradient id="flame" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff7a8"/><stop offset="40%" stop-color="#ff8c2b"/><stop offset="100%" stop-color="#ff3b1f" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="520" fill="url(#sky)"/>
<!-- Sun -->
<circle cx="860" cy="338" r="34" fill="url(#sunGrad)"/><circle cx="860" cy="338" r="14" fill="#fff5c2"/>
<!-- Mountains -->
<path d="M0 342 L90 315 L160 328 L220 300 L280 322 L340 295 L420 320 L500 302 L560 318 L620 290 L700 318 L760 305 L860 322 L920 310 L1000 325 L1000 342 Z" fill="#0b1228" opacity="0.55"/>
<!-- Clouds with horizontal drift -->
<g opacity="0.92">
  <ellipse cx="820" cy="88" rx="46" ry="18" fill="white"/><ellipse cx="845" cy="82" rx="32" ry="16" fill="white"/><ellipse cx="795" cy="82" rx="28" ry="14" fill="white"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; -110 0; 0 0" dur="14s" repeatCount="indefinite"/>
</g>
<g opacity="0.88">
  <ellipse cx="560" cy="68" rx="38" ry="14" fill="white"/><ellipse cx="580" cy="62" rx="26" ry="12" fill="white"/><ellipse cx="540" cy="64" rx="22" ry="11" fill="white"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="18s" repeatCount="indefinite" additive="sum"/>
</g>
<!-- Ground -->
<rect y="342" width="1000" height="178" fill="#22301e"/><rect y="342" width="1000" height="90" fill="#2d4a26"/>
<!-- Runway -->
<g filter="url(#softShadow)">
  <path d="M145 335 L505 335 L1000 480 L0 480 Z" fill="url(#asphalt)" stroke="#0f1218" stroke-width="1.2"/>
  <path d="M210 335 L230 335 L340 480 L300 480 Z" fill="white" opacity="0.96"/><path d="M245 335 L260 335 L390 480 L360 480 Z" fill="white"/><path d="M275 335 L285 335 L440 480 L420 480 Z" fill="white"/><path d="M300 335 L310 335 L490 480 L470 480 Z" fill="white"/>
  <path d="M145 335 L0 480" stroke="#ffcc33" stroke-width="3"/><path d="M505 335 L1000 480" stroke="#ffcc33" stroke-width="3"/>
  <g fill="white" opacity="0.92"><rect x="260" y="362" width="48" height="10" rx="1" transform="skewX(-18)"/><rect x="340" y="362" width="48" height="10" rx="1" transform="skewX(-18)"/><rect x="220" y="390" width="58" height="14" rx="1.5" transform="skewX(-16)"/><rect x="300" y="390" width="58" height="14" rx="1.5" transform="skewX(-16)"/></g>
  <path d="M325 335 L530 480" stroke="white" stroke-width="3.2" stroke-linecap="round" opacity="0.95" stroke-dasharray="22 26">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <rect x="145" y="334" width="360" height="5" rx="1" fill="white"/>
</g>
<!-- PAPI -->
<g transform="translate(470,340)"><rect x="-42" y="-6" width="46" height="9" rx="2" fill="#111827"/><circle cx="-34" cy="-1.5" r="3.2" fill="#ff3b30"/><circle cx="-24" cy="-1.5" r="3.2" fill="#ff3b30"/><circle cx="-14" cy="-1.5" r="3.2" fill="white"/><circle cx="-4" cy="-1.5" r="3.2" fill="white"/></g>
<!-- Runway lights blinking -->
<g fill="#ffcc33">
  <circle cx="60" cy="458" r="2.6"><animate attributeName="opacity" values="1;0.45;1" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="424" r="2.2"><animate attributeName="opacity" values="1;0.45;1" dur="1s" begin="0.24s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="388" r="1.8"><animate attributeName="opacity" values="1;0.45;1" dur="1s" begin="0.48s" repeatCount="indefinite"/></circle>
  <circle cx="940" cy="458" r="2.6"><animate attributeName="opacity" values="1;0.45;1" dur="1s" begin="0.6s" repeatCount="indefinite"/></circle>
</g>

<!-- Animated Plane along motion path -->
<g>
  <!-- define motion path via animateTransform: we use discrete keyframe animation with animateTransform sequence simulated via multiple animates -->
  <!-- Simpler: use animateMotion along path, but we want rotation control, so we use CSS-like JS? For pure SVG compatibility we provide animateTransform with keyTimes -->
  <g id="plane">
    <!-- Plane body (same as HTML version simplified) -->
    <path d="M38 -14 L58 -14 L66 -30 L48 -30 Z" fill="#0f172a"/><path d="M42 -14 L56 -14 L62 -28.5 L48 -28.5 Z" fill="#ef4444"/>
    <path d="M36 -4 L52 -4 L56 -10 L40 -10 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.6"/>
    <path d="M-62 -10 C-72 -11 -72 12 -62 12 L46 12 C51 12 56 9 59 5 L64 0 L59 -5 C56 -9 51 -12 46 -12 Z" fill="url(#fuselageGrad)" stroke="#94a3b8" stroke-width="0.9"/>
    <path d="M-58 2 L48 2 L52 5 L-55 5 Z" fill="url(#stripe)"/>
    <path d="M-58 -7 L-48 -7 L-46 -3 L-60 -3 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="0.7"/><path d="M-47 -7 L-38 -7 L-36 -3 L-45 -3 Z" fill="#38bdf8"/>
    <g fill="#1e293b" stroke="#38bdf8" stroke-width="0.35"><ellipse cx="-28" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="-20" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="-12" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="-4" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="4" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="12" cy="-1" rx="2.1" ry="1.6"/><ellipse cx="20" cy="-1" rx="2.1" ry="1.6"/></g>
    <path d="M-12 3 L18 3 L30 15 L-2 15 Z" fill="url(#wingGrad)" stroke="#94a3b8" stroke-width="0.9"/>
    <path d="M8 11 L30 11 L28 15 L6 15 Z" fill="#9ca3af"/>
    <g transform="translate(4,7)"><ellipse cx="0" cy="4" rx="11" ry="7" fill="#e2e8f0" stroke="#64748b" stroke-width="0.8"/><ellipse cx="-5" cy="4" rx="5.5" ry="5" fill="#0f172a"/><g transform="translate(8,4)"><path d="M0 -3.5 L14 0 L0 3.5 Z" fill="url(#flame)"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="0.2s" repeatCount="indefinite"/></path></g></g>
    <!-- landing gear -->
    <g>
      <path d="M-44 12 L-44 19.5" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-44" cy="21.5" r="4" fill="#0f172a"/>
      <path d="M8 12 L8 19.5" stroke="#334155" stroke-width="2.2"/><circle cx="8" cy="21.5" r="4.4" fill="#0f172a"/><circle cx="14" cy="21.5" r="4.4" fill="#0f172a"/>
    </g>
    <circle cx="-8" cy="12" r="1.2" fill="#ef4444"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>

    <!-- Flight animation via animateTransform -->
    <!-- We chain translate and rotate: using additive transforms -->
    <animateTransform attributeName="transform" type="translate" values="560 -90; 360 10; 190 110; 45 205; -8 232; -40 230; -180 230" keyTimes="0;0.18;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="-11; -8; -5; -1; 5; 0; 0" keyTimes="0;0.18;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" additive="sum"/>
    <animateTransform attributeName="transform" type="scale" values="0.92;0.96;0.99;1;1;1;1" keyTimes="0;0.18;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1" keyTimes="0;0.06;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite"/>
  </g>
</g>
<!-- shadow under plane -->
<g opacity="0.22">
  <ellipse cx="0" cy="250" rx="62" ry="10" fill="#000">
    <animateTransform attributeName="transform" type="translate" values="560 0; 360 0; 190 0; 45 0; -8 0; -40 0; -180 0" keyTimes="0;0.18;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" additive="sum"/>
    <animate attributeName="rx" values="22;34;49;65;74;84;62" keyTimes="0;0.18;0.35;0.62;0.78;0.88;1" dur="12s" repeatCount="indefinite"/>
  </ellipse>
</g>
<!-- HUD static -->
<g font-family="monospace" font-size="10" fill="white" opacity="0.88">
  <g transform="translate(14,14)"><rect x="0" y="0" width="138" height="52" rx="10" fill="rgba(0,0,0,0.32)" stroke="rgba(255,255,255,0.14)"/><text x="10" y="16" font-size="9" fill="#9fb1d6" font-weight="700">APPROACH • ILS 24L</text><text x="10" y="30" fill="#7dd3fc" font-weight="700">ALT ▾ 12s LOOP<animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></text><text x="10" y="42" fill="#fde68a">SPD 148 kt • FLAPS 30°</text></g>
</g>
<rect x="0" y="0" width="1000" height="520" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="6"/>
</svg>
