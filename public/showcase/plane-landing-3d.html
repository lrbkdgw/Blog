<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>飞机降落 · 3D 动画</title>
<style>
  :root{
    --dur:20s;
    --d:1400px;
    --card-w:460px;
    --card-h:184px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04070c;overflow:hidden}
  body{display:grid;place-items:center;font-family:"Noto Sans SC","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif}

  /* ================= 舞台 ================= */
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 1.7778));
    aspect-ratio:1280/720;
    overflow:hidden;
    perspective:var(--d);
    perspective-origin:50% 42%;
    transform-style:preserve-3d;
    isolation:isolate;
    background:
      radial-gradient(105% 62% at 50% 42%, rgba(255,178,122,.34) 0%, rgba(255,150,110,.15) 32%, rgba(0,0,0,0) 60%),
      radial-gradient(80% 44% at 80% 30%, rgba(120,170,255,.16) 0%, rgba(0,0,0,0) 62%),
      linear-gradient(180deg,#070e1b 0%,#0c1a2c 26%,#142a44 46%,#22415a 58%,#3a6273 68%,#4a7484 100%);
  }

  /* ================= 天空 ================= */
  .sky{position:absolute;inset:0;z-index:0;overflow:hidden}
  .sky i{
    position:absolute;display:block;border-radius:50%;background:#eaf4ff;
    box-shadow:0 0 7px rgba(200,225,255,.85);
    animation:twinkle 5.2s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.28}50%{opacity:.95}}
  .moon{
    position:absolute;right:12%;top:12%;width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 36% 33%, #fffdf3 0%, #ffedc9 50%, #f6ce93 100%);
    box-shadow:0 0 90px 30px rgba(255,222,172,.26), inset -12px -9px 24px rgba(206,166,116,.45);
  }
  .moon::after{
    content:"";position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,228,184,.22) 42%, rgba(255,228,184,0) 72%);
    animation:moonGlow 8s ease-in-out infinite;
  }
  @keyframes moonGlow{0%,100%{opacity:.55}50%{opacity:1}}
  .cloud{
    position:absolute;height:46px;border-radius:46px;filter:blur(10px);
    background:linear-gradient(180deg, rgba(196,220,240,.4), rgba(120,155,185,.12));
    animation:drift linear infinite;
  }
  .cloud.c1{width:280px;left:6%;top:20%;animation-duration:78s}
  .cloud.c2{width:190px;left:54%;top:13%;animation-duration:104s;animation-delay:-40s;opacity:.65}
  .cloud.c3{width:360px;left:22%;top:31%;animation-duration:132s;animation-delay:-80s;opacity:.45}
  @keyframes drift{0%{transform:translateX(-13vw)}100%{transform:translateX(15vw)}}

  /* 天际线（屏幕空间，紧贴地平线之下） */
  .city{
    position:absolute;left:0;right:0;bottom:58%;
    height:9%;z-index:1;pointer-events:none;overflow:hidden;
    mask-image:linear-gradient(180deg,#000 0 62%, transparent 100%);
  }
  .city i{position:absolute;bottom:0;display:block;background:#0a1523}
  .city i::after{
    content:"";position:absolute;inset:4px 3px auto 3px;height:1px;
    background:rgba(150,200,240,.45);
    box-shadow:0 5px 0 rgba(150,200,240,.22), 0 10px 0 rgba(150,200,240,.12);
  }

  /* ================= 3D 世界 ================= */
  .world{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    transform-style:preserve-3d;
    /* perspective 只对直接子元素生效；.world 被 .thud 包裹，所以这里必须再声明一次 */
    perspective:var(--d);
    perspective-origin:50% 42%;
  }

  /* 地面：先平移到相机高度，再绕 X 轴放平成水平面 */
  .ground{
    position:absolute;left:50%;top:50%;
    width:2600px;height:5400px;
    margin-left:-1300px;margin-top:-2700px;
    transform:translateY(192.4px) translateZ(300px) rotateX(-90deg);
    transform-style:preserve-3d;
    background:
      linear-gradient(180deg, rgba(30,55,78,.35) 0%, rgba(16,29,43,.95) 6%, #0d1a27 100%);
  }
  .ground::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 74%, rgba(0,0,0,.6));
  }

  /* 跑道：位于地面上方 1px，避免与地面 z-fighting */
  .runway{
    position:absolute;left:50%;top:0;
    width:500px;height:2750px;
    margin-left:-250px;margin-top:2550px;
    transform:translateZ(1px);
    background:linear-gradient(180deg,#24292f 0%,#161c22 30%,#10161b 70%,#0c1217 100%);
    box-shadow:0 0 90px 24px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .runway .edge{position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(180deg, rgba(234,243,255,.08), rgba(234,243,255,.85))}
  .runway .edge.l{left:16px}
  .runway .edge.r{right:16px}
  .runway .marks{position:absolute;inset:0;animation:runwayScroll var(--dur) linear infinite}
  .runway .lights{position:absolute;inset:0;filter:drop-shadow(0 0 6px rgba(150,220,255,.9))}
  .approach{
    position:absolute;left:0;top:0;width:100%;height:100%;
    filter:drop-shadow(0 0 9px rgba(255,230,160,.9));
  }

  /* 接地带光晕 */
  .touchzone{
    position:absolute;left:50%;top:0;width:500px;height:420px;
    margin-left:-250px;margin-top:490px;
    transform:translateZ(2px);
    background:radial-gradient(60% 100% at 50% 0%, rgba(255,214,150,.14), rgba(255,214,150,0) 70%);
  }

  /* ================= 飞机 ================= */
  .airplane{
    position:absolute;left:50%;top:42%;
    width:460px;height:184px;
    margin-left:-230px;margin-top:-92px;
    transform-style:preserve-3d;
    animation:planePath var(--dur) linear infinite;
    will-change:transform;
  }
  .airplane .card{
    width:100%;height:100%;transform-style:preserve-3d;
    animation:planeAttitude var(--dur) linear infinite;
    transform-origin:50% 77.5%; /* 机轮接触线（anchorY=310/400） */
  }
  .airplane svg{display:block;width:100%;height:100%;overflow:visible}

  /* 影子：贴地平面 */
  .shadow{
    position:absolute;left:50%;top:42%;
    width:0;height:0;transform-style:preserve-3d;
  }
  .shadow i{
    position:absolute;left:-210px;top:-40px;width:420px;height:80px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,.22) 52%, rgba(0,0,0,0) 100%);
    animation:planeShadow var(--dur) linear infinite;
    filter:blur(6px);
    transform-style:preserve-3d;
  }

  /* ================= 大气 ================= */
  .haze{
    position:absolute;inset:0;z-index:6;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(30,60,84,0) 26%,
      rgba(96,140,152,.42) 38.5%,
      rgba(122,164,168,.3) 44%,
      rgba(14,32,48,0) 64%);
    mix-blend-mode:screen;
  }
  .flare{
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(62% 40% at 50% 46%, rgba(255,196,140,.12), rgba(0,0,0,0) 72%);
    mix-blend-mode:screen;
  }
  .vignette{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(125% 95% at 50% 38%, rgba(0,0,0,0) 50%, rgba(0,0,0,.48) 100%);
  }
  .grain{
    position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.15;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .thud{position:absolute;inset:0;z-index:4;pointer-events:none;animation:thud var(--dur) linear infinite}

  /* ================= HUD ================= */
  .phases{position:absolute;left:0;right:0;top:28%;z-index:9;text-align:center;pointer-events:none}
  .phase{
    position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    padding:7px 18px;border-radius:999px;
    font-size:clamp(10px,1.05vw,14px);letter-spacing:.32em;color:#dcecfb;
    background:rgba(8,18,30,.4);border:1px solid rgba(140,190,225,.22);
    backdrop-filter:blur(6px);
    opacity:0;animation:phaseA var(--dur) linear infinite;
  }
  .phase.b{animation-name:phaseB}
  .phase.c{animation-name:phaseC}
  .phase.d{animation-name:phaseD}
  @keyframes phaseA{0%{opacity:0}2%{opacity:1}14.5%{opacity:1}17%{opacity:0}100%{opacity:0}}
  @keyframes phaseB{0%,14.5%{opacity:0}17%{opacity:1}53%{opacity:1}56%{opacity:0}100%{opacity:0}}
  @keyframes phaseC{0%,53%{opacity:0}56%{opacity:1}82%{opacity:1}85%{opacity:0}100%{opacity:0}}
  @keyframes phaseD{0%,82%{opacity:0}85%{opacity:1}97%{opacity:1}100%{opacity:0}}

  .hud{
    position:absolute;left:0;right:0;bottom:0;z-index:9;
    padding:clamp(14px,2.2vw,30px);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    font-size:clamp(10px,1vw,13px);letter-spacing:.1em;color:#bed6e8;pointer-events:none;
  }
  .hud .title{font-size:clamp(13px,1.5vw,20px);letter-spacing:.24em;color:#eaf4ff;text-shadow:0 2px 26px rgba(120,190,255,.35)}
  .hud .title small{display:block;font-size:.56em;letter-spacing:.36em;color:#8fb4cc;margin-top:7px}
  .pill{
    padding:8px 15px;border-radius:999px;background:rgba(8,18,30,.5);
    border:1px solid rgba(140,190,225,.26);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:9px;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#7ff0ff;box-shadow:0 0 10px #7ff0ff;animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* ================= 关键帧 ================= */
