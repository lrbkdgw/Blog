<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动画展示 · 鹈鹕骑自行车 & 飞机降落</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:#070b12;color:#dbe7f3;
    font-family:"Noto Sans SC","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;gap:28px;padding:clamp(18px,3vw,44px);
  }
  header h1{margin:0 0 8px;font-size:clamp(20px,2.6vw,32px);letter-spacing:.06em}
  header p{margin:0;color:#8fa9c0;font-size:clamp(12px,1.2vw,15px)}
  section{background:#0c1420;border:1px solid #1b2a3c;border-radius:18px;padding:clamp(12px,1.6vw,20px)}
  h2{margin:0 0 12px;font-size:clamp(14px,1.5vw,18px);letter-spacing:.12em;color:#9fc2dc;font-weight:600}
  .pelican img,.pelican object{display:block;width:100%;height:auto;border-radius:12px;background:#0b1220}
  .plane{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
  .plane iframe{display:block;width:100%;height:100%;border:0}
  footer{color:#5f7a92;font-size:12px;letter-spacing:.04em}
  a{color:#6fd7ff}
</style>
</head>
<body>
<header>
  <h1>两个动画</h1>
  <p>纯 SVG / CSS 实现，无 JavaScript、无外部依赖，可直接离线打开。</p>
</header>

<section class="pelican">
  <h2>01 · 鹈鹕骑自行车（SVG 动画）</h2>
  <img src="pelican-bike.svg" alt="夜间公路上，一只戴红围巾的鹈鹕骑着自行车，车轮与踏板持续转动" />
</section>

<section>
  <h2>02 · 飞机降落（CSS 3D 动画）</h2>
  <div class="plane"><iframe src="plane-landing-3d.html" title="飞机降落 3D 动画" loading="lazy"></iframe></div>
</section>

<footer>文件：<a href="pelican-bike.svg">pelican-bike.svg</a> · <a href="plane-landing-3d.html">plane-landing-3d.html</a></footer>
</body>
</html>
